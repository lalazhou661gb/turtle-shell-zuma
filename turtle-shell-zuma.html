<title>龜殼祖瑪</title>
<style>
  :root{
    --pond-mist:#eafaf0;
    --pond-sky:#d9f0f5;
    --pond-deep:#3f7a5c;
    --pond-leaf:#5fa972;
    --pond-coral:#ff8fa3;
    --pond-card:#fffdf6;
    --pond-text:#33564a;
    --pond-text-soft:#6b8f7f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 18%, rgba(191,230,176,0.5) 0, transparent 40%),
      radial-gradient(circle at 88% 82%, rgba(142,205,240,0.35) 0, transparent 45%),
      linear-gradient(160deg, var(--pond-mist) 0%, var(--pond-sky) 60%, var(--pond-mist) 100%);
    font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    color:var(--pond-text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px 56px;
    overflow-x:hidden;
  }
  @font-face{
    font-family:'Baloo 2';
    src:local('Baloo 2');
  }
  .zw-bg-bubble{
    position:fixed;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.15) 70%);
    opacity:0.5;
    pointer-events:none;
    animation:zw-float 9s ease-in-out infinite;
  }
  @keyframes zw-float{
    0%,100%{ transform:translateY(0px); }
    50%{ transform:translateY(-22px); }
  }
  @media (prefers-reduced-motion: reduce){
    .zw-bg-bubble{ animation:none; }
    .zw-header, .zw-scale-wrap{ animation:none !important; }
  }
  .zw-header{
    text-align:center;
    max-width:560px;
    margin-bottom:22px;
    animation:zw-rise .7s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes zw-rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .zw-eyebrow{
    font-family:"Baloo 2","PingFang TC",sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--pond-leaf);
    margin:0 0 6px;
  }
  .zw-h1{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 0 10px;
    font-size:clamp(28px,6vw,38px);
    font-weight:800;
    color:var(--pond-deep);
    text-wrap:balance;
  }
  .zw-tagline{
    margin:0;
    font-size:15px;
    line-height:1.7;
    color:var(--pond-text-soft);
  }
  .zw-scale-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    animation:zw-rise .8s .1s cubic-bezier(.2,.8,.3,1) both;
  }
  .zw-root{
    width:680px;
    height:780px;
    flex-shrink:0;
    transform-origin:top center;
    box-sizing:border-box;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:linear-gradient(160deg,#eafaf0 0%,#dff3f8 55%,#e8f6e4 100%);
    border-radius:28px;
    position:relative;
    box-shadow:0 22px 50px rgba(63,122,92,0.22), 0 2px 0 rgba(255,255,255,0.6) inset;
  }
  a{ color:var(--pond-leaf); }
  a:hover{ color:var(--pond-deep); }
  .zw-hud{display:flex;align-items:center;justify-content:space-between;height:52px;flex-shrink:0;padding:0 4px;}
  .zw-title{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:800;color:var(--pond-deep);letter-spacing:1px;}
  .zw-badges{display:flex;gap:10px;font-family:"Baloo 2","PingFang TC",sans-serif;}
  .zw-badge{background:rgba(255,255,255,0.8);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:#4a7c66;box-shadow:0 2px 6px rgba(0,0,0,0.06);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
  .zw-badge b{color:var(--pond-coral);font-size:16px;}
  .zw-stage{position:relative;width:640px;height:640px;border-radius:22px;overflow:hidden;box-shadow:0 4px 18px rgba(60,110,90,0.18);flex-shrink:0;}
  canvas#zw-canvas{display:block;width:640px;height:640px;touch-action:none;cursor:crosshair;}
  .zw-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,60,50,0.4);}
  .zw-overlay.show{display:flex;}
  .zw-panel{background:var(--pond-card);border-radius:24px;padding:28px 32px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.22);max-width:400px;}
  .zw-panel h2{margin:0 0 8px;font-size:26px;color:var(--pond-deep);}
  .zw-panel p{margin:0 0 18px;font-size:14px;color:var(--pond-text-soft);line-height:1.7;}
  .zw-btn{border:none;border-radius:999px;padding:12px 30px;font-family:"Baloo 2","PingFang TC",sans-serif;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7bd6a0,#4fb787);box-shadow:0 6px 14px rgba(79,183,135,0.4);cursor:pointer;min-height:44px;min-width:130px;transition:transform .15s ease, box-shadow .15s ease;}
  .zw-btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(79,183,135,0.5);}
  .zw-btn:active{transform:translateY(0);}
  .zw-btn:focus-visible{outline:3px solid var(--pond-coral);outline-offset:2px;}
  .zw-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:#5f8a76;opacity:.85;pointer-events:none;}
  .zw-name-row{display:flex;gap:8px;margin-bottom:14px;}
  .zw-name-input{flex:1;min-width:0;border:2px solid #d9ecd9;border-radius:999px;padding:10px 16px;font-size:15px;font-family:inherit;color:var(--pond-text);background:#fff;outline:none;transition:border-color .15s ease;}
  .zw-name-input:focus{border-color:var(--pond-leaf);}
  .zw-name-error{font-size:12px;color:#e0607a;min-height:16px;margin:-8px 0 12px;}
  .zw-lb-wrap{width:100%;max-width:640px;margin-top:18px;animation:zw-rise .8s .2s cubic-bezier(.2,.8,.3,1) both;}
  .zw-lb-card{background:var(--pond-card);border-radius:22px;padding:18px 22px;box-shadow:0 14px 30px rgba(63,122,92,0.14);}
  .zw-lb-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--pond-deep);margin:0 0 12px;}
  .zw-lb-list{display:flex;flex-direction:column;gap:6px;}
  .zw-lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;font-size:14px;}
  .zw-lb-row.me{background:#eafaf0;}
  .zw-lb-rank{width:22px;flex-shrink:0;font-family:"Baloo 2","PingFang TC",sans-serif;font-weight:800;color:var(--pond-leaf);text-align:center;}
  .zw-lb-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pond-text);}
  .zw-lb-score{font-family:"Baloo 2","PingFang TC",sans-serif;font-weight:800;color:var(--pond-coral);font-variant-numeric:tabular-nums;}
  .zw-lb-empty{font-size:13px;color:var(--pond-text-soft);text-align:center;padding:8px 0;}
  .zw-lb-note{font-size:11px;color:var(--pond-text-soft);text-align:center;margin-top:10px;}
</style>

<script>
(function(){
  function fitScale(){
    var wrap = document.getElementById('zw-scale-wrap');
    var card = document.getElementById('zw-root');
    var available = Math.min(window.innerWidth - 32, 680);
    var scale = Math.min(1, available / 680);
    card.style.transform = 'scale(' + scale + ')';
    wrap.style.height = (780 * scale) + 'px';
  }
  window.addEventListener('resize', fitScale);
  fitScale();

  var HS_KEY = 'zw-turtle-zuma-highscore';
  function readLocalBest(){
    try { return parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function writeLocalBest(v){
    try { localStorage.setItem(HS_KEY, String(v)); } catch (e) {}
  }
  function getPlayerId(){
    try {
      var id = localStorage.getItem('zw-player-id');
      if (!id) { id = 'p-' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('zw-player-id', id); }
      return id;
    } catch (e) { return 'p-' + Math.random().toString(36).slice(2); }
  }
  function loadStoredName(){
    try { return localStorage.getItem('zw-player-name') || ''; } catch (e) { return ''; }
  }
  function saveStoredName(n){
    try { localStorage.setItem('zw-player-name', n); } catch (e) {}
  }
  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  // Filled in after deploying worker/leaderboard-worker.js to Cloudflare Workers.
  // Used only as a fallback when this page is not running inside a Claude Artifact
  // (e.g. hosted on GitHub Pages), so friends outside claude.ai can share a leaderboard too.
  const LEADERBOARD_API = '';

  const playerId = getPlayerId();
  let lbCollection = null;
  let myDocRef = null;
  let backend = null;
  document.getElementById('zw-name-input').value = loadStoredName();

  const canvas = document.getElementById('zw-canvas');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = 640 * DPR;
  canvas.height = 640 * DPR;
  canvas.style.width = '640px';
  canvas.style.height = '640px';
  ctx.scale(DPR, DPR);
  canvas.addEventListener('dragstart', e => e.preventDefault());

  const cx = 320, cy = 320, R_OUT = 286, R_IN = 54, TURNS = 2.25;
  const BALL_R = 17, SPACING = BALL_R * 2 * 0.94;
  const TOTAL_SHELLS = 42;

  const thetaMax = TURNS * Math.PI * 2;
  const steps = 900;
  const pathPts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const theta = t * thetaMax;
    const r = R_OUT - (R_OUT - R_IN) * t;
    const ang = theta - Math.PI / 2;
    pathPts.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang) });
  }
  const cumLen = [0];
  for (let i = 1; i < pathPts.length; i++) {
    const dx = pathPts[i].x - pathPts[i - 1].x, dy = pathPts[i].y - pathPts[i - 1].y;
    cumLen.push(cumLen[i - 1] + Math.hypot(dx, dy));
  }
  const pathLength = cumLen[cumLen.length - 1];

  function pointAt(d) {
    if (d <= 0) return { x: pathPts[0].x, y: pathPts[0].y };
    if (d >= pathLength) return { x: pathPts[pathPts.length - 1].x, y: pathPts[pathPts.length - 1].y };
    let lo = 0, hi = cumLen.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cumLen[mid] < d) lo = mid + 1; else hi = mid; }
    const i0 = Math.max(0, lo - 1);
    const segLen = cumLen[lo] - cumLen[i0] || 1;
    const tt = (d - cumLen[i0]) / segLen;
    const p0 = pathPts[i0], p1 = pathPts[lo];
    return { x: p0.x + (p1.x - p0.x) * tt, y: p0.y + (p1.y - p0.y) * tt };
  }
  function nearestTraveled(x, y) {
    let best = Infinity, bi = 0;
    for (let i = 0; i < pathPts.length; i++) {
      const dx = pathPts[i].x - x, dy = pathPts[i].y - y;
      const dd = dx * dx + dy * dy;
      if (dd < best) { best = dd; bi = i; }
    }
    return cumLen[bi];
  }

  const COLORS = ['#ff9eb5', '#8ecdf0', '#ffe066', '#a8e6a1', '#c8a2ff'];

  function shade(hex, percent) {
    const f = parseInt(hex.slice(1), 16), t = percent < 0 ? 0 : 255, p = Math.abs(percent) / 100;
    const R = f >> 16, G = (f >> 8) & 0x00FF, B = f & 0x0000FF;
    return '#' + (0x1000000 + (Math.round((t - R) * p) + R) * 0x10000 + (Math.round((t - G) * p) + G) * 0x100 + (Math.round((t - B) * p) + B)).toString(16).slice(1);
  }

  function makeShellSprite(baseColor) {
    const pad = 6, size = (BALL_R + pad) * 2;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const cx0 = size / 2, cy0 = size / 2;
    const light = shade(baseColor, 35), dark = shade(baseColor, -25), rim = shade(baseColor, -40);
    g.beginPath(); g.ellipse(cx0, cy0 + BALL_R * 0.82, BALL_R * 0.8, BALL_R * 0.32, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(40,60,50,0.16)'; g.fill();
    g.beginPath(); g.arc(cx0, cy0, BALL_R, 0, Math.PI * 2);
    g.fillStyle = baseColor; g.fill(); g.lineWidth = 2.4; g.strokeStyle = rim; g.stroke();
    const hexR = BALL_R * 0.42;
    const hexPts = [];
    for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; hexPts.push([cx0 + hexR * Math.cos(a), cy0 + hexR * Math.sin(a)]); }
    g.beginPath();
    hexPts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath(); g.fillStyle = light; g.fill(); g.lineWidth = 1.6; g.strokeStyle = dark; g.stroke();
    const outR = BALL_R * 0.88;
    hexPts.forEach((p, i) => {
      const a = -Math.PI / 2 + i * Math.PI / 3;
      const ox = cx0 + outR * Math.cos(a), oy = cy0 + outR * Math.sin(a);
      g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(ox, oy); g.strokeStyle = dark; g.lineWidth = 1.4; g.stroke();
    });
    g.beginPath(); g.ellipse(cx0 - BALL_R * 0.35, cy0 - BALL_R * 0.4, BALL_R * 0.32, BALL_R * 0.18, -0.5, 0, Math.PI * 2);
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill();
    const skin = '#fff4d6', skinDark = '#e3c48c';
    g.beginPath(); g.arc(cx0, cy0 - BALL_R * 0.92, BALL_R * 0.38, 0, Math.PI * 2);
    g.fillStyle = skin; g.fill(); g.lineWidth = 1.4; g.strokeStyle = skinDark; g.stroke();
    g.beginPath(); g.arc(cx0 - BALL_R * 0.14, cy0 - BALL_R * 0.98, BALL_R * 0.06, 0, Math.PI * 2); g.fillStyle = '#4a3f35'; g.fill();
    g.beginPath(); g.arc(cx0 + BALL_R * 0.14, cy0 - BALL_R * 0.98, BALL_R * 0.06, 0, Math.PI * 2); g.fillStyle = '#4a3f35'; g.fill();
    g.fillStyle = 'rgba(255,150,170,0.5)';
    g.beginPath(); g.ellipse(cx0 - BALL_R * 0.28, cy0 - BALL_R * 0.85, BALL_R * 0.09, BALL_R * 0.06, 0, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.ellipse(cx0 + BALL_R * 0.28, cy0 - BALL_R * 0.85, BALL_R * 0.09, BALL_R * 0.06, 0, 0, Math.PI * 2); g.fill();
    [-1, 1].forEach(s => {
      g.beginPath(); g.ellipse(cx0 + s * BALL_R * 0.62, cy0 + BALL_R * 0.72, BALL_R * 0.22, BALL_R * 0.16, 0, 0, Math.PI * 2);
      g.fillStyle = skin; g.fill(); g.lineWidth = 1.2; g.strokeStyle = skinDark; g.stroke();
    });
    return c;
  }
  const sprites = {};
  COLORS.forEach(c => { sprites[c] = makeShellSprite(c); });

  function drawLilyPad(x, y, r) {
    ctx.save(); ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, r, 0.35, Math.PI * 2 - 0.35); ctx.lineTo(0, 0); ctx.closePath();
    ctx.fillStyle = '#bfe6b0'; ctx.fill(); ctx.strokeStyle = '#9fd18c'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.restore();
  }

  const state = {
    status: 'start', chain: [], shots: [], particles: [], score: 0,
    aimAngle: -Math.PI / 2, pressed: false, currentColor: null, nextColor: null,
    playerName: '', personalBest: readLocalBest(),
  };
  document.getElementById('zw-highscore').textContent = state.personalBest;

  function pickColor() {
    if (state.chain.length) {
      const set = [...new Set(state.chain.map(b => b.color))];
      return set[Math.floor(Math.random() * set.length)];
    }
    return COLORS[Math.floor(Math.random() * COLORS.length)];
  }

  function showOverlay(id) {
    ['zw-start', 'zw-win', 'zw-lose'].forEach(o => document.getElementById(o).classList.toggle('show', o === id));
  }
  function hideOverlays() {
    ['zw-start', 'zw-win', 'zw-lose'].forEach(o => document.getElementById(o).classList.remove('show'));
  }
  function updateHUD() {
    document.getElementById('zw-score').textContent = state.score;
    document.getElementById('zw-remain').textContent = state.chain.length;
    if (state.score > state.personalBest) {
      state.personalBest = state.score;
      document.getElementById('zw-highscore').textContent = state.personalBest;
    }
  }

  function finalizeScore() {
    writeLocalBest(state.personalBest);
    if (backend === 'claude-db' && myDocRef) {
      myDocRef.set({ name: state.playerName || '無名龜', score: state.personalBest, updatedAt: Date.now() }).catch(function () {});
    } else if (backend === 'cloudflare' && LEADERBOARD_API) {
      fetch(LEADERBOARD_API + '/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: playerId, name: state.playerName || '無名龜', score: state.personalBest }),
      }).then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) { if (data && data.top) renderLeaderboard(data.top); })
        .catch(function () {});
    }
  }

  function applyPersonalBest(score, name) {
    if (typeof score === 'number' && score > state.personalBest) {
      state.personalBest = score;
      document.getElementById('zw-highscore').textContent = state.personalBest;
    }
    const nameInput = document.getElementById('zw-name-input');
    if (name && !nameInput.value) nameInput.value = name;
  }

  function renderLeaderboard(entries) {
    const list = document.getElementById('zw-lb-list');
    if (!entries.length) { list.innerHTML = '<p class="zw-lb-empty">尚無排行資料,快來搶頭香!</p>'; return; }
    list.innerHTML = entries.map(function (e, i) {
      const name = escapeHtml(String(e.name || '無名龜').slice(0, 12));
      const score = Number(e.score) || 0;
      const mine = e.id === playerId ? ' me' : '';
      return '<div class="zw-lb-row' + mine + '"><span class="zw-lb-rank">' + (i + 1) + '</span><span class="zw-lb-name">' + name + '</span><span class="zw-lb-score">' + score + '</span></div>';
    }).join('');
  }

  function showLbNote() {
    const note = document.getElementById('zw-lb-note');
    if (note) note.hidden = false;
  }

  async function tryClaudeDb() {
    if (!window.claude || !window.claude.use) return false;
    let db = null;
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    if (!db) return false;
    backend = 'claude-db';
    lbCollection = db.collection('leaderboard');
    myDocRef = lbCollection.doc(playerId);
    try {
      const snap = await myDocRef.get();
      if (snap.exists) {
        const d = snap.data();
        applyPersonalBest(d.score, d.name);
      }
    } catch (e) {}
    lbCollection.orderBy('score', 'desc').limit(5).onSnapshot(function (snap) {
      renderLeaderboard(snap.docs.map(function (d) {
        const data = d.data() || {};
        return { id: d.id, name: data.name, score: data.score };
      }));
    }, function () { showLbNote(); });
    return true;
  }

  function startCloudflarePolling() {
    setInterval(function () {
      fetch(LEADERBOARD_API + '/leaderboard')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) { if (data && data.top) renderLeaderboard(data.top); })
        .catch(function () {});
    }, 8000);
  }

  async function tryCloudflare() {
    if (!LEADERBOARD_API) return false;
    try {
      const [lbRes, meRes] = await Promise.all([
        fetch(LEADERBOARD_API + '/leaderboard'),
        fetch(LEADERBOARD_API + '/score?id=' + encodeURIComponent(playerId)),
      ]);
      backend = 'cloudflare';
      if (lbRes.ok) { const data = await lbRes.json(); renderLeaderboard(data.top || []); }
      if (meRes.ok) { const data = await meRes.json(); if (data.entry) applyPersonalBest(data.entry.score, data.entry.name); }
      startCloudflarePolling();
      return true;
    } catch (e) { return false; }
  }

  (async function initLeaderboard() {
    const ok = await tryClaudeDb();
    if (!ok) {
      const ok2 = await tryCloudflare();
      if (!ok2) showLbNote();
    }
  })();

  function initGame() {
    state.chain = []; state.shots = []; state.particles = []; state.score = 0; state.status = 'playing';
    hideOverlays();
    for (let i = 0; i < TOTAL_SHELLS; i++) {
      state.chain.push({ color: COLORS[Math.floor(Math.random() * COLORS.length)], traveled: -i * SPACING });
    }
    state.currentColor = pickColor();
    state.nextColor = pickColor();
    updateHUD();
  }

  function triggerWin() {
    state.status = 'win';
    finalizeScore();
    document.getElementById('zw-win-score').textContent = state.score;
    showOverlay('zw-win');
  }
  function triggerLose() {
    state.status = 'lose';
    finalizeScore();
    document.getElementById('zw-lose-score').textContent = state.score;
    showOverlay('zw-lose');
  }

  function spawnBurst(x, y, color) {
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 70;
      state.particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6, maxLife: 0.6, color, r: 3 + Math.random() * 3 });
    }
    state.particles.push({ x, y, vx: 0, vy: -30, life: 0.9, maxLife: 0.9, color: '#3f7a5c', text: '+15' });
  }
  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; p.life -= dt;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
  }

  function resolveMatches(startIdx) {
    let idx = startIdx, changed = true;
    while (changed) {
      changed = false;
      if (idx < 0 || idx >= state.chain.length) break;
      const color = state.chain[idx].color;
      let lo = idx, hi = idx;
      while (lo - 1 >= 0 && state.chain[lo - 1].color === color) lo--;
      while (hi + 1 < state.chain.length && state.chain[hi + 1].color === color) hi++;
      if (hi - lo + 1 >= 3) {
        for (let i = lo; i <= hi; i++) {
          const b = state.chain[i];
          const p = pointAt(Math.max(0, b.traveled));
          spawnBurst(p.x, p.y, b.color);
        }
        state.score += (hi - lo + 1) * 15;
        state.chain.splice(lo, hi - lo + 1);
        updateHUD();
        if (state.chain.length === 0) { changed = false; }
        else { idx = Math.min(lo, state.chain.length - 1); changed = true; }
      }
    }
  }

  function insertShot(shot, k) {
    const chain = state.chain;
    const t_shot = nearestTraveled(shot.x, shot.y);
    let idx = t_shot > chain[k].traveled ? k : k + 1;
    const newBall = { color: shot.color, traveled: 0 };
    if (idx === 0) newBall.traveled = chain[0].traveled + SPACING;
    else if (idx >= chain.length) newBall.traveled = chain[chain.length - 1].traveled - SPACING;
    else newBall.traveled = chain[idx - 1].traveled - SPACING;
    chain.splice(idx, 0, newBall);
    updateHUD();
    resolveMatches(idx);
  }

  function fireShot() {
    if (state.status !== 'playing') return;
    const speed = 520;
    state.shots.push({
      x: cx, y: cy,
      vx: Math.cos(state.aimAngle) * speed, vy: Math.sin(state.aimAngle) * speed,
      color: state.currentColor,
    });
    state.currentColor = state.nextColor;
    state.nextColor = pickColor();
  }

  function update(dt) {
    updateParticles(dt);
    if (state.status !== 'playing') return;
    if (state.chain.length) {
      const speed = 44 + Math.min(46, state.score * 0.02);
      state.chain[0].traveled += speed * dt;
      const followSpeed = speed * 2.2;
      const maxStep = followSpeed * dt;
      for (let i = 1; i < state.chain.length; i++) {
        const maxT = state.chain[i - 1].traveled - SPACING;
        const diff = maxT - state.chain[i].traveled;
        if (Math.abs(diff) <= maxStep) state.chain[i].traveled = maxT;
        else state.chain[i].traveled += Math.sign(diff) * maxStep;
      }
      if (state.chain[0].traveled >= pathLength) { triggerLose(); return; }
    } else {
      triggerWin(); return;
    }
    for (let i = state.shots.length - 1; i >= 0; i--) {
      const s = state.shots[i];
      s.x += s.vx * dt; s.y += s.vy * dt;
      const dist = Math.hypot(s.x - cx, s.y - cy);
      if (dist > R_OUT + 40) { state.shots.splice(i, 1); continue; }
      let hitIdx = -1;
      for (let k = 0; k < state.chain.length; k++) {
        const p = pointAt(Math.max(0, state.chain[k].traveled));
        if (Math.hypot(p.x - s.x, p.y - s.y) < BALL_R * 1.7) { hitIdx = k; break; }
      }
      if (hitIdx >= 0) { insertShot(s, hitIdx); state.shots.splice(i, 1); }
    }
  }

  function drawHub() {
    ctx.beginPath(); ctx.arc(cx, cy, BALL_R * 1.9, 0, Math.PI * 2); ctx.fillStyle = '#5f9d6d'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, BALL_R * 1.5, 0, Math.PI * 2); ctx.fillStyle = '#3f7a5c'; ctx.fill();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(state.aimAngle + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(-10, 4); ctx.lineTo(-7, -BALL_R * 1.4); ctx.lineTo(7, -BALL_R * 1.4); ctx.lineTo(10, 4); ctx.closePath();
    ctx.fillStyle = '#fff4d6'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#e3c48c'; ctx.stroke();
    ctx.restore();
    if (state.currentColor) {
      const spr = sprites[state.currentColor];
      ctx.drawImage(spr, cx - spr.width / 2, cy - spr.height / 2);
    }
    if (state.nextColor) {
      const spr = sprites[state.nextColor];
      ctx.save(); ctx.translate(cx + BALL_R * 2.6, cy + BALL_R * 2.6); ctx.scale(0.6, 0.6);
      ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, 640, 640);
    const grad = ctx.createLinearGradient(0, 0, 0, 640);
    grad.addColorStop(0, '#eafaf0'); grad.addColorStop(1, '#d9f0f5');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, 640, 640);
    drawLilyPad(66, 66, 32); drawLilyPad(566, 86, 24); drawLilyPad(84, 566, 26); drawLilyPad(578, 572, 34);
    ctx.beginPath();
    pathPts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = '#e8dcb8'; ctx.lineWidth = BALL_R * 2.1; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    for (let i = state.chain.length - 1; i >= 0; i--) {
      const b = state.chain[i];
      if (b.traveled < 0) continue;
      const p = pointAt(b.traveled);
      const spr = sprites[b.color];
      ctx.drawImage(spr, p.x - spr.width / 2, p.y - spr.height / 2);
    }
    state.shots.forEach(s => {
      const spr = sprites[s.color];
      ctx.drawImage(spr, s.x - spr.width / 2, s.y - spr.height / 2);
    });
    state.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      if (p.text) {
        ctx.fillStyle = p.color; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
      }
      ctx.globalAlpha = 1;
    });
    if (state.status === 'playing') {
      ctx.save(); ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(state.aimAngle) * 300, cy + Math.sin(state.aimAngle) * 300);
      ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(63,122,92,0.35)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    drawHub();
  }

  function angleFromEvent(evt) {
    const rect = canvas.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * (640 / rect.width);
    const y = (evt.clientY - rect.top) * (640 / rect.height);
    return { x, y, angle: Math.atan2(y - cy, x - cx) };
  }

  canvas.addEventListener('pointerdown', e => {
    const { x, y } = angleFromEvent(e);
    const sx = cx + BALL_R * 2.6, sy = cy + BALL_R * 2.6;
    if (state.status === 'playing' && Math.hypot(x - sx, y - sy) < BALL_R * 1.1) {
      const t = state.currentColor; state.currentColor = state.nextColor; state.nextColor = t;
      return;
    }
    state.pressed = true; state.aimAngle = angleFromEvent(e).angle;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener('pointermove', e => {
    state.aimAngle = angleFromEvent(e).angle;
  });
  canvas.addEventListener('pointerup', () => {
    if (state.pressed) { state.pressed = false; fireShot(); }
  });
  canvas.addEventListener('pointercancel', () => { state.pressed = false; });

  function beginGame() {
    const input = document.getElementById('zw-name-input');
    const name = input.value.trim();
    const errEl = document.getElementById('zw-name-error');
    if (!name) {
      errEl.textContent = '請先幫小龜取個名字吧!';
      input.focus();
      return;
    }
    errEl.textContent = '';
    state.playerName = name;
    saveStoredName(name);
    document.getElementById('zw-player-title').textContent = name + ' 的池塘';
    initGame();
  }

  document.getElementById('zw-start-btn').addEventListener('click', beginGame);
  document.getElementById('zw-name-input').addEventListener('keydown', e => { if (e.key === 'Enter') beginGame(); });
  document.getElementById('zw-win-btn').addEventListener('click', initGame);
  document.getElementById('zw-lose-btn').addEventListener('click', initGame);

  let lastTime = null;
  function loop(ts) {
    if (lastTime == null) lastTime = ts;
    const dt = Math.min(0.033, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
